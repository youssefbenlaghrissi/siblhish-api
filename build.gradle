plugins {
    id 'java'
    id 'scala'
    id 'org.springframework.boot' version '4.0.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'io.gatling.gradle' version '3.14.9.8'
}

group = 'ma.siblhish'
version = '0.0.1-SNAPSHOT'
description = 'siblhish-api'

java {
    sourceCompatibility = '21'
    targetCompatibility = '21'
}

scala {
    scalaVersion = '2.13.12'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.postgresql:postgresql:42.7.8'
    
    // Spring Security Crypto pour le hashage des mots de passe
    implementation 'org.springframework.security:spring-security-crypto:6.3.0'
    
    // Firebase Admin SDK pour l'API V1 (recommandé)
    implementation 'com.google.firebase:firebase-admin:9.3.0'
    
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Tests de charge : l’API doit tourner (ex. ./gradlew bootRun)
// ./gradlew gatlingRun
gatling {
    systemProperties = [
        'gatling.core.baseUrl': project.findProperty('loadTest.baseUrl') ?: "http://localhost:${project.findProperty('loadTest.port') ?: '8082'}/api/v1"
    ]
}
