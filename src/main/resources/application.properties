spring.application.name=siblhish-api

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/siblhish}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# API Configuration
server.servlet.context-path=/api/v1
server.port=8081

# Firebase Configuration
# Pour l'API V1, utiliser un Service Account JSON
# 1. Aller dans Firebase Console → Paramètres du projet → Comptes de service
# 2. Générer une nouvelle clé privée et télécharger le fichier JSON
# 3. Placer le fichier dans src/main/resources/firebase-service-account.json
# Local/dev uniquement. En prod, utiliser FIREBASE_SERVICE_ACCOUNT_JSON en variable d'env.
firebase.service-account-classpath=${FIREBASE_SERVICE_ACCOUNT_CLASSPATH:}
# firebase.service-account-path=/chemin/vers/firebase-service-account.json

# Logging
logging.level.root=INFO
logging.level.ma.siblhish=DEBUG
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG
logging.level.org.springframework.web=INFO

